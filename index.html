<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Four in a Row | Game for Manav</title>
<meta name="description" content="Four in a Row: a free Connect 4 game for kids. Play against a friend or the computer. No ads, no tracking, no accounts. Made for Manav.">
<style>
  :root{
    --paper:#f4ede0;
    --paper-2:#e9dfcd;
    --ink:#25313a;
    --ink-soft:#6c7a83;
    --board:#2f5d73;
    --board-edge:#244755;
    --p1:#e4573d;
    --p1-hi:#f78a6d;
    --p2:#f0b134;
    --p2-hi:#ffd473;
    --cell: clamp(30px, 9.2vmin, 68px);
    --gap: calc(var(--cell) * 0.16);
    --radius: calc(var(--cell) * 0.5);
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:
      radial-gradient(120% 100% at 50% 0%, #faf5ea 0%, var(--paper) 45%, var(--paper-2) 100%);
    color:var(--ink);
    font-family: ui-rounded, "SF Pro Rounded", "Hiragino Maru Gothic ProN", -apple-system,
                 BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    display:grid;
    place-items:center;
    padding:24px 16px 32px;
    -webkit-font-smoothing:antialiased;
  }

  .stage{display:flex;flex-direction:column;align-items:center;gap:18px;width:100%;max-width:720px}

  header{text-align:center}
  h1{
    font-size:clamp(26px,4.6vmin,40px);
    letter-spacing:-0.02em;
    font-weight:800;
    line-height:1.1;
  }
  h1 span{color:var(--p1)}
  h1 i{font-style:normal;color:var(--p2)}
  .tagline{
    margin-top:8px;
    font-size:clamp(12px,1.5vmin,14px);
    letter-spacing:0.16em;
    text-transform:uppercase;
    font-weight:700;
    color:var(--ink-soft);
  }

  /* ---------- turn + score ---------- */
  .hud{
    display:flex;align-items:center;justify-content:center;gap:10px;
    flex-wrap:wrap;width:100%;
  }
  .turn{
    display:inline-flex;align-items:center;gap:10px;
    background:#fff;
    border:1px solid #ddd2bd;
    border-radius:999px;
    padding:9px 18px 9px 12px;
    font-size:15px;font-weight:700;
    box-shadow:0 2px 0 #e2d7c2, 0 8px 18px -12px rgba(37,49,58,.5);
  }
  .turn .chip{
    width:22px;height:22px;border-radius:50%;
    background:radial-gradient(circle at 33% 30%, var(--p1-hi), var(--p1) 62%, #b93a26);
    box-shadow:inset 0 -2px 4px rgba(0,0,0,.28);
    transition:background .3s;
  }
  .turn.p2 .chip{
    background:radial-gradient(circle at 33% 30%, var(--p2-hi), var(--p2) 62%, #c98a16);
  }
  .score{
    display:flex;gap:6px;align-items:center;
    font-size:14px;font-weight:700;color:var(--ink-soft);
    letter-spacing:.01em;
  }
  .score b{color:var(--ink);font-variant-numeric:tabular-nums}
  .score .sep{opacity:.4}

  /* ---------- board ---------- */
  .board-shell{
    position:relative;
    padding: calc(var(--gap) * 1.5);
    border-radius: calc(var(--cell) * .34);
    background:
      linear-gradient(180deg, #356880 0%, var(--board) 22%, var(--board-edge) 100%);
    box-shadow:
      inset 0 2px 0 rgba(255,255,255,.22),
      inset 0 -6px 14px rgba(0,0,0,.32),
      0 18px 30px -18px rgba(24,42,53,.7),
      0 3px 0 #1b3742;
  }
  .board{
    position:relative;
    display:grid;
    grid-template-columns:repeat(7, var(--cell));
    grid-template-rows:repeat(6, var(--cell));
    gap:var(--gap);
    --cell: clamp(30px, 9.2vmin, 68px);
  }

  .col{position:relative;display:contents}

  .cell{
    position:relative;
    width:var(--cell);height:var(--cell);
    border-radius:50%;
    background:
      radial-gradient(circle at 50% 34%, #17323d 0%, #1d3d4a 55%, #2a5567 100%);
    box-shadow:
      inset 0 3px 6px rgba(0,0,0,.5),
      inset 0 -2px 3px rgba(255,255,255,.13);
    cursor:pointer;
    display:grid;
    place-items:center;
  }
  .cell:focus-visible{
    outline:3px solid #ffffff;
    outline-offset:3px;
  }

  /* ghost preview when hovering a column */
  .cell.ghost::after{
    content:"";
    position:absolute;
    inset:14%;
    border-radius:50%;
    background:var(--p1);
    opacity:.26;
  }
  body.turn2 .cell.ghost::after{background:var(--p2)}
  .cell.blocked{cursor:not-allowed}
  .cell.blocked.ghost::after{display:none}

  /* ---------- tokens ---------- */
  .token{
    position:absolute;
    inset:7%;
    border-radius:50%;
    background:
      radial-gradient(circle at 34% 28%, var(--p1-hi) 0%, var(--p1) 48%, #b93a26 100%);
    box-shadow:
      inset 0 -4px 8px rgba(0,0,0,.3),
      inset 0 3px 5px rgba(255,255,255,.34),
      0 3px 6px rgba(0,0,0,.35);
    will-change:transform;
  }
  .token.p2{
    background:
      radial-gradient(circle at 34% 28%, var(--p2-hi) 0%, var(--p2) 48%, #c98a16 100%);
  }
  .token::after{
    content:"";
    position:absolute;
    left:22%;top:16%;width:30%;height:22%;
    border-radius:50%;
    background:rgba(255,255,255,.55);
    filter:blur(1.5px);
  }

  @keyframes drop{
    0%   { transform: translateY(calc(var(--cell) * var(--r) * -1.15)) scale(.96); }
    62%  { transform: translateY(0) scale(1.04, .93); }
    80%  { transform: translateY(calc(var(--cell) * -.10)) scale(.98, 1.03); }
    100% { transform: translateY(0) scale(1); }
  }
  .token.falling{ animation: drop 520ms cubic-bezier(.34,.06,.4,1) both; }

  @keyframes winpop{
    0%,100%{ transform:scale(1) }
    45%    { transform:scale(1.16) }
  }
  .cell.win .token{
    animation: winpop 620ms ease-in-out infinite;
    box-shadow:
      inset 0 -4px 8px rgba(0,0,0,.3),
      inset 0 3px 5px rgba(255,255,255,.34),
      0 0 0 3px #fff,
      0 0 26px 4px rgba(255,255,255,.75);
  }

  /* ---------- controls ---------- */
  .controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center;width:100%}
  button{
    font:inherit;font-weight:700;font-size:15px;
    padding:12px 22px;border-radius:999px;
    border:1px solid #d6cab4;
    background:#fff;color:var(--ink);
    cursor:pointer;
    box-shadow:0 2px 0 #ddd2bd, 0 10px 18px -14px rgba(37,49,58,.6);
    transition:transform .12s, box-shadow .12s, background .2s;
  }
  button:hover{background:#fffdf8}
  button:active{transform:translateY(2px);box-shadow:0 0 0 #ddd2bd}
  button:focus-visible{outline:3px solid var(--board);outline-offset:3px}
  button.primary{
    background:var(--board);border-color:var(--board-edge);color:#fff;
    box-shadow:0 2px 0 #1b3742, 0 10px 18px -14px rgba(24,42,53,.9);
  }
  button.primary:hover{background:#356880}
  button:disabled{opacity:.45;cursor:not-allowed}

  /* ---------- difficulty ---------- */
  .levels{
    display:flex;align-items:center;gap:12px;
    flex-wrap:wrap;justify-content:center;width:100%;
  }
  .levels[hidden]{display:none}
  .levels-label{
    font-size:11.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
    color:var(--ink-soft);
  }
  .seg{
    display:inline-flex;gap:2px;
    background:#fff;border:1px solid #d6cab4;border-radius:999px;padding:4px;
    box-shadow:0 2px 0 #ddd2bd;
  }
  .seg button{
    border:none;background:transparent;box-shadow:none;
    padding:8px 18px;font-size:14px;font-weight:700;border-radius:999px;
    color:var(--ink-soft);
  }
  .seg button:hover{background:#f6f1e7;color:var(--ink)}
  .seg button:active{transform:none;box-shadow:none}
  .seg button.on{
    background:var(--board);color:#fff;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.22);
  }
  .seg button.on:hover{background:var(--board);color:#fff}
  .seg button:focus-visible{outline:3px solid var(--board);outline-offset:2px}

  .hint{font-size:13.5px;color:var(--ink-soft);text-align:center;min-height:20px}
  .hint kbd{
    font-family:inherit;font-size:12px;font-weight:700;
    background:#fff;border:1px solid #d6cab4;border-bottom-width:2px;
    border-radius:6px;padding:1px 6px;
  }

  /* ---------- banner ---------- */
  .banner{
    position:absolute;inset:0;
    display:grid;place-items:center;
    border-radius:inherit;
    background:rgba(244,237,224,.78);
    backdrop-filter:blur(3px);
    opacity:0;pointer-events:none;
    transition:opacity .28s;
  }
  .banner.show{opacity:1;pointer-events:auto}
  .banner .card{
    text-align:center;
    background:#fff;
    border:1px solid #ddd2bd;
    border-radius:calc(var(--cell)*.3);
    padding:26px 32px;
    box-shadow:0 20px 40px -24px rgba(24,42,53,.75);
    transform:translateY(8px) scale(.96);
    transition:transform .3s cubic-bezier(.2,.9,.3,1.2);
  }
  .banner.show .card{transform:none}
  .banner h2{font-size:clamp(20px,3.4vmin,28px);letter-spacing:-.01em;margin-bottom:6px}
  .banner p{color:var(--ink-soft);font-size:14.5px;margin-bottom:18px}

  @media (prefers-reduced-motion: reduce){
    .token.falling{animation:none}
    .cell.win .token{animation:none}
    .banner,.banner .card{transition:none}
  }

  @media (max-width:430px){
    .hud{gap:8px}
    .turn{padding:8px 14px 8px 10px;font-size:14px}
    button{padding:11px 16px;font-size:14px}
  }
</style>
</head>
<body>
<div class="stage">
  <header>
    <h1>Four <span>in a</span> <i>Row</i></h1>
    <p class="tagline">a game for Manav</p>
  </header>

  <div class="hud">
    <div class="turn" id="turn">
      <span class="chip" aria-hidden="true"></span>
      <span id="turnLabel">Red to play</span>
    </div>
    <div class="score">
      <span>Red <b id="s1">0</b></span>
      <span class="sep">·</span>
      <span>Yellow <b id="s2">0</b></span>
    </div>
  </div>

  <div class="board-shell">
    <div class="board" id="board" role="grid" aria-label="Four in a row board, 7 columns by 6 rows"></div>
    <div class="banner" id="banner">
      <div class="card">
        <h2 id="bannerTitle">Red wins!</h2>
        <p id="bannerText">Four in a row.</p>
        <button class="primary" id="bannerBtn">Play again</button>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="primary" id="newBtn">New game</button>
    <button id="undoBtn">Undo</button>
    <button id="modeBtn">Play the computer</button>
  </div>

  <div class="levels" id="levels" hidden>
    <span class="levels-label">Computer level</span>
    <div class="seg" role="group" aria-label="Computer difficulty">
      <button type="button" data-level="easy" class="on">Easy</button>
      <button type="button" data-level="medium">Medium</button>
      <button type="button" data-level="hard">Hard</button>
    </div>
  </div>

  <p class="hint" id="hint">
    Click a column to drop. Or use <kbd>←</kbd> <kbd>→</kbd> and <kbd>Enter</kbd>.
  </p>
  <p aria-live="polite" class="sr-only" id="live" style="position:absolute;left:-9999px"></p>
</div>

<script>
(() => {
  "use strict";

  const COLS = 7, ROWS = 6;
  const boardEl = document.getElementById("board");
  const turnEl = document.getElementById("turn");
  const turnLabel = document.getElementById("turnLabel");
  const hintEl = document.getElementById("hint");
  const liveEl = document.getElementById("live");
  const banner = document.getElementById("banner");
  const bannerTitle = document.getElementById("bannerTitle");
  const bannerText = document.getElementById("bannerText");
  const s1 = document.getElementById("s1");
  const s2 = document.getElementById("s2");
  const undoBtn = document.getElementById("undoBtn");
  const modeBtn = document.getElementById("modeBtn");
  const levelsEl = document.getElementById("levels");

  /** grid[row][col] = null | 1 | 2 ; row 0 is the TOP row */
  let grid = [];
  let turn = 1;          // 1 = red, 2 = yellow
  let over = false;
  let history = [];      // {row, col, player}
  let vsComputer = false;
  let level = "easy";    // easy | medium | hard
  let scores = { 1: 0, 2: 0 };
  let busy = false;      // blocks input while a token falls
  let hoverCol = 3;

  const cellEls = [];    // cellEls[row][col]

  /* ---------------- build ---------------- */
  function buildBoard() {
    boardEl.innerHTML = "";
    cellEls.length = 0;
    for (let r = 0; r < ROWS; r++) {
      const row = [];
      for (let c = 0; c < COLS; c++) {
        const cell = document.createElement("div");
        cell.className = "cell";
        cell.dataset.row = r;
        cell.dataset.col = c;
        cell.tabIndex = r === 0 ? 0 : -1;     // roving tabindex, top row only
        cell.setAttribute("role", "gridcell");
        cell.setAttribute("aria-label", `column ${c + 1}, row ${r + 1}`);
        cell.addEventListener("click", () => onColumn(c));
        cell.addEventListener("mouseenter", () => setHover(c));
        boardEl.appendChild(cell);
        row.push(cell);
      }
      cellEls.push(row);
    }
    boardEl.addEventListener("mouseleave", () => setHover(-1));
  }

  /* ---------------- state helpers ---------------- */
  function emptyGrid() {
    grid = Array.from({ length: ROWS }, () => Array(COLS).fill(null));
  }

  function lowestEmptyRow(col) {
    for (let r = ROWS - 1; r >= 0; r--) {
      if (grid[r][col] === null) return r;
    }
    return -1;
  }

  /** returns array of [r,c] for a 4-run through (row,col), or null */
  function findWin(row, col, player) {
    const dirs = [[0, 1], [1, 0], [1, 1], [1, -1]];
    for (const [dr, dc] of dirs) {
      const line = [[row, col]];
      for (const sign of [1, -1]) {
        let r = row + dr * sign, c = col + dc * sign;
        while (r >= 0 && r < ROWS && c >= 0 && c < COLS && grid[r][c] === player) {
          line.push([r, c]);
          r += dr * sign; c += dc * sign;
        }
      }
      if (line.length >= 4) {
        // return exactly the longest run (trim extras beyond 4 for display)
        return line;
      }
    }
    return null;
  }

  function isFull() {
    return grid[0].every(v => v !== null);
  }

  /* ---------------- rendering ---------------- */
  function render() {
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const cell = cellEls[r][c];
        const val = grid[r][c];
        const existing = cell.querySelector(".token");
        if (val === null) {
          if (existing) existing.remove();
          cell.classList.remove("win");
        } else if (!existing) {
          const t = document.createElement("div");
          t.className = "token" + (val === 2 ? " p2" : "");
          t.dataset.player = val;
          cell.appendChild(t);
        }
      }
    }
    // turn chrome
    turnEl.classList.toggle("p2", turn === 2 && !over);
    if (!over) turnLabel.textContent = turn === 1 ? "Red to play" : "Yellow to play";
    document.body.classList.toggle("turn2", turn === 2);
    s1.textContent = scores[1];
    s2.textContent = scores[2];
    undoBtn.disabled = history.length === 0 || over;
  }

  function setHover(col) {
    hoverCol = col;
    for (let r = 0; r < ROWS; r++)
      for (let c = 0; c < COLS; c++) cellEls[r][c].classList.remove("ghost");

    if (col < 0 || over) return;
    const row = lowestEmptyRow(col);
    if (row === -1) return;
    cellEls[row][col].classList.add("ghost");
  }

  function announce(msg) { liveEl.textContent = msg; }

  /* ---------------- moves ---------------- */
  function onColumn(col) {
    if (over || busy) return;
    if (vsComputer && turn === 2) return;    // computer's turn
    drop(col);
  }

  function drop(col) {
    const row = lowestEmptyRow(col);
    if (row === -1) return;

    const player = turn;
    grid[row][col] = player;
    history.push({ row, col, player });

    // build the token with a fall animation
    const cell = cellEls[row][col];
    cell.classList.remove("ghost");
    const t = document.createElement("div");
    t.className = "token falling" + (player === 2 ? " p2" : "");
    t.style.setProperty("--r", String(row + 1));
    cell.appendChild(t);

    busy = true;
    const done = () => {
      busy = false;
      t.classList.remove("falling");
      t.style.removeProperty("--r");
    };
    t.addEventListener("animationend", done, { once: true });
    setTimeout(done, 620);   // safety net if animations are disabled

    const line = findWin(row, col, player);
    if (line) {
      over = true;
      line.forEach(([r, c]) => cellEls[r][c].classList.add("win"));
      scores[player]++;
      turnLabel.textContent = player === 1 ? "Red wins" : "Yellow wins";
      showBanner(player === 1 ? "Red wins!" : "Yellow wins!",
                 "Four in a row. Nice one.");
      announce(`Game over. ${player === 1 ? "Red" : "Yellow"} wins.`);
      s1.textContent = scores[1];
      s2.textContent = scores[2];
      undoBtn.disabled = true;
      return;
    }

    if (isFull()) {
      over = true;
      turnLabel.textContent = "Draw";
      showBanner("It's a draw", "The board is full. Nobody wins this one.");
      announce("Game over. It is a draw.");
      undoBtn.disabled = true;
      return;
    }

    turn = player === 1 ? 2 : 1;
    render();
    setHover(hoverCol);
    announce(`${turn === 1 ? "Red" : "Yellow"} to play.`);

    if (vsComputer && turn === 2) {
      setTimeout(computerMove, 420);
    }
  }

  /* ================= computer opponent ================= */
  /* Board is mirrored into a flat Int8Array for the search, so the
     minimax can make and unmake moves without cloning. */

  const WIN_WINDOWS = (() => {
    const w = [];
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const i = r * COLS + c;
        if (c + 3 < COLS) w.push([i, i + 1, i + 2, i + 3]);
        if (r + 3 < ROWS) w.push([i, i + COLS, i + COLS * 2, i + COLS * 3]);
        if (r + 3 < ROWS && c + 3 < COLS) w.push([i, i + COLS + 1, i + COLS * 2 + 2, i + COLS * 3 + 3]);
        if (r + 3 < ROWS && c - 3 >= 0) w.push([i, i + COLS - 1, i + COLS * 2 - 2, i + COLS * 3 - 3]);
      }
    }
    return w;
  })();

  const ORDER = [3, 2, 4, 1, 5, 0, 6];     // centre-first move ordering
  const WEIGHT = [0, 1, 12, 70];           // n discs in a window

  function winsAt(cells, r, c, p) {
    for (const [dr, dc] of [[0, 1], [1, 0], [1, 1], [1, -1]]) {
      let n = 1;
      for (const s of [1, -1]) {
        let rr = r + dr * s, cc = c + dc * s;
        while (rr >= 0 && rr < ROWS && cc >= 0 && cc < COLS && cells[rr * COLS + cc] === p) {
          n++; rr += dr * s; cc += dc * s;
        }
      }
      if (n >= 4) return true;
    }
    return false;
  }

  function evaluate(cells, me, opp) {
    let score = 0;
    for (let k = 0; k < WIN_WINDOWS.length; k++) {
      const win = WIN_WINDOWS[k];
      let mine = 0, theirs = 0;
      for (let j = 0; j < 4; j++) {
        const v = cells[win[j]];
        if (v === me) mine++;
        else if (v === opp) theirs++;
      }
      if (mine && theirs) continue;              // blocked window is worthless
      if (mine) score += WEIGHT[mine];
      else if (theirs) score -= WEIGHT[theirs] * 1.1;
    }
    for (let r = 0; r < ROWS; r++) {             // centre control
      const v = cells[r * COLS + 3];
      if (v === me) score += 5;
      else if (v === opp) score -= 5;
    }
    return score;
  }

  let deadline = 0;

  function search(cells, heights, depth, alpha, beta, turn, me, opp, ply) {
    if (depth <= 0 || performance.now() > deadline) return evaluate(cells, me, opp);
    let any = false;
    let best = turn === me ? -Infinity : Infinity;

    for (let k = 0; k < ORDER.length; k++) {
      const c = ORDER[k];
      if (heights[c] >= ROWS) continue;
      any = true;
      const r = ROWS - 1 - heights[c];
      cells[r * COLS + c] = turn; heights[c]++;

      let val;
      if (winsAt(cells, r, c, turn)) {
        val = turn === me ? 100000 - ply : -100000 + ply;
      } else {
        val = search(cells, heights, depth - 1, alpha, beta,
                     turn === me ? opp : me, me, opp, ply + 1);
      }

      cells[r * COLS + c] = 0; heights[c]--;

      if (turn === me) {
        if (val > best) best = val;
        if (best > alpha) alpha = best;
      } else {
        if (val < best) best = val;
        if (best < beta) beta = best;
      }
      if (alpha >= beta) break;
    }
    return any ? best : 0;
  }

  /* Iterative deepening with a time budget, so the UI never locks up. */
  function searchRoot(cells, heights, maxDepth, budgetMs) {
    deadline = performance.now() + budgetMs;
    let bestCol = -1, bestVal = -Infinity;

    for (let d = 1; d <= maxDepth; d++) {
      let localBest = -Infinity, localCol = -1, alpha = -Infinity;
      for (let k = 0; k < ORDER.length; k++) {
        const c = ORDER[k];
        if (heights[c] >= ROWS) continue;
        const r = ROWS - 1 - heights[c];
        cells[r * COLS + c] = 2; heights[c]++;

        let val;
        if (winsAt(cells, r, c, 2)) val = 100000;
        else val = search(cells, heights, d - 1, alpha, Infinity, 1, 2, 1, 1);

        cells[r * COLS + c] = 0; heights[c]--;

        if (val > localBest) { localBest = val; localCol = c; }
        if (localBest > alpha) alpha = localBest;
      }
      if (localCol !== -1) { bestCol = localCol; bestVal = localBest; }
      if (performance.now() > deadline) break;
      if (bestVal >= 100000) break;              // a win is already found
    }
    return bestCol;
  }

  function toBoardState() {
    const cells = new Int8Array(ROWS * COLS);
    const heights = new Int8Array(COLS);
    for (let c = 0; c < COLS; c++) {
      let h = 0;
      for (let r = ROWS - 1; r >= 0; r--) {
        const v = grid[r][c];
        if (v !== null) { cells[r * COLS + c] = v; h++; }
      }
      heights[c] = h;
    }
    return { cells, heights };
  }

  function immediateWinCol(cells, heights, p) {
    for (let k = 0; k < ORDER.length; k++) {
      const c = ORDER[k];
      if (heights[c] >= ROWS) continue;
      const r = ROWS - 1 - heights[c];
      cells[r * COLS + c] = p;
      const w = winsAt(cells, r, c, p);
      cells[r * COLS + c] = 0;
      if (w) return c;
    }
    return -1;
  }

  function chooseMove(levelName) {
    const { cells, heights } = toBoardState();
    const open = ORDER.filter(c => heights[c] < ROWS);
    if (!open.length) return -1;

    // every level takes a free win
    const win = immediateWinCol(cells, heights, 2);
    if (win !== -1 && (levelName !== "easy" || Math.random() < 0.6)) return win;

    if (levelName === "easy") {
      // no blocking on purpose, mild centre preference
      const weights = open.map(c => (c === 3 ? 2 : 1));
      const total = weights.reduce((a, b) => a + b, 0);
      let pick = Math.random() * total;
      for (let i = 0; i < open.length; i++) {
        pick -= weights[i];
        if (pick <= 0) return open[i];
      }
      return open[0];
    }

    if (levelName === "medium") {
      const block = immediateWinCol(cells, heights, 1);
      if (block !== -1) return block;
      const col = searchRoot(cells, heights, 4, 140);
      return col === -1 ? open[0] : col;
    }

    const col = searchRoot(cells, heights, 9, 380);
    return col === -1 ? open[0] : col;
  }

  function computerMove() {
    if (over) return;
    const col = chooseMove(level);
    if (col >= 0) drop(col);
  }

  /* ---------------- banner ---------------- */
  function showBanner(title, text) {
    bannerTitle.textContent = title;
    bannerText.textContent = text;
    banner.classList.add("show");
  }
  function hideBanner() { banner.classList.remove("show"); }

  /* ---------------- controls ---------------- */
  function newGame(keepMode = true) {
    emptyGrid();
    turn = 1;
    over = false;
    busy = false;
    history = [];
    hideBanner();
    buildBoard();
    render();
    setHover(-1);
    turnLabel.textContent = "Red to play";
    announce("New game. Red to play.");
    if (!keepMode) { /* nothing */ }
  }

  function undo() {
    if (over || history.length === 0 || busy) return;
    // in computer mode, undo both the computer's move and yours
    const steps = (vsComputer && history.length >= 2) ? 2 : 1;
    for (let i = 0; i < steps; i++) {
      const last = history.pop();
      if (!last) break;
      grid[last.row][last.col] = null;
      turn = last.player;
    }
    turn = history.length ? (history[history.length - 1].player === 1 ? 2 : 1) : 1;
    hideBanner();
    render();
    setHover(-1);
    announce(`Undone. ${turn === 1 ? "Red" : "Yellow"} to play.`);
  }

  function updateHint() {
    if (!vsComputer) {
      hintEl.innerHTML = 'Click a column to drop. Or use <kbd>←</kbd> <kbd>→</kbd> and <kbd>Enter</kbd>.';
      return;
    }
    const name = level === "easy" ? "Easy" : level === "medium" ? "Medium" : "Hard";
    hintEl.innerHTML = `You are <b>Red</b>. The computer plays yellow on <b>${name}</b>.`;
  }

  document.getElementById("newBtn").addEventListener("click", () => newGame());
  document.getElementById("bannerBtn").addEventListener("click", () => newGame());
  undoBtn.addEventListener("click", undo);

  modeBtn.addEventListener("click", () => {
    vsComputer = !vsComputer;
    modeBtn.textContent = vsComputer ? "Two players" : "Play the computer";
    levelsEl.hidden = !vsComputer;
    updateHint();
    newGame();
  });

  levelsEl.addEventListener("click", (e) => {
    const btn = e.target.closest("[data-level]");
    if (!btn) return;
    level = btn.dataset.level;
    levelsEl.querySelectorAll("[data-level]").forEach(b => b.classList.toggle("on", b === btn));
    updateHint();
  });

  /* keyboard: arrows move between columns, enter drops */
  document.addEventListener("keydown", (e) => {
    if (over) return;
    const colFromFocus = () => {
      const a = document.activeElement;
      return a && a.dataset && a.dataset.col !== undefined ? Number(a.dataset.col) : -1;
    };
    let c = colFromFocus();
    if (c === -1) c = hoverCol === -1 ? 3 : hoverCol;

    if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
      e.preventDefault();
      const next = Math.max(0, Math.min(COLS - 1, c + (e.key === "ArrowLeft" ? -1 : 1)));
      setHover(next);
      cellEls[0][next].focus();
    } else if (e.key === "Enter" || e.key === " " || e.key === "ArrowDown") {
      e.preventDefault();
      onColumn(c);
    }
  });

  /* ---------------- boot ---------------- */
  emptyGrid();
  buildBoard();
  render();

  /* ---------------- self test (open with ?test=1) ---------------- */
  if (new URLSearchParams(location.search).get("test") === "1") {
    const results = [];
    const t = (name, cond) => results.push([name, !!cond]);

    // horizontal win
    emptyGrid();
    for (let c = 0; c < 3; c++) grid[5][c] = 1;
    grid[5][3] = 1;
    t("horizontal win", findWin(5, 3, 1) !== null);

    // vertical win
    emptyGrid();
    for (let r = 5; r > 1; r--) grid[r][2] = 2;
    t("vertical win", findWin(2, 2, 2) !== null);

    // diagonal down-right
    emptyGrid();
    grid[2][0] = 1; grid[3][1] = 1; grid[4][2] = 1; grid[5][3] = 1;
    t("diagonal win", findWin(5, 3, 1) !== null);

    // diagonal up-right
    emptyGrid();
    grid[5][0] = 2; grid[4][1] = 2; grid[3][2] = 2; grid[2][3] = 2;
    t("anti-diagonal win", findWin(2, 3, 2) !== null);

    // no false positive
    emptyGrid();
    grid[5][0] = 1; grid[5][1] = 1; grid[5][2] = 1;
    t("three is not a win", findWin(5, 2, 1) === null);

    // gravity
    emptyGrid();
    t("lowest empty is bottom", lowestEmptyRow(0) === ROWS - 1);
    grid[5][0] = 1;
    t("lowest empty moves up", lowestEmptyRow(0) === ROWS - 2);

    // full column is unplayable
    emptyGrid();
    for (let r = 0; r < ROWS; r++) grid[r][6] = 1;
    t("full column rejected", lowestEmptyRow(6) === -1);

    // full board detection
    emptyGrid();
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) grid[r][c] = 1;
    t("full board detected", isFull());

    // ---- computer difficulty ----
    // every level takes a free win (easy is probabilistic, so check the others)
    emptyGrid();
    grid[5][0] = 2; grid[5][1] = 2; grid[5][2] = 2;
    t("medium takes a win", chooseMove("medium") === 3);
    emptyGrid();
    grid[5][0] = 2; grid[5][1] = 2; grid[5][2] = 2;
    t("hard takes a win", chooseMove("hard") === 3);

    // both must block an open three on the left, or lose next move
    emptyGrid();
    grid[5][0] = 1; grid[5][1] = 1; grid[5][2] = 1;
    grid[5][5] = 2; grid[5][6] = 2;
    t("medium blocks a three", chooseMove("medium") === 3);
    emptyGrid();
    grid[5][0] = 1; grid[5][1] = 1; grid[5][2] = 1;
    grid[5][5] = 2; grid[5][6] = 2;
    t("hard blocks a three", chooseMove("hard") === 3);

    // hard must block a vertical threat too
    emptyGrid();
    grid[5][4] = 1; grid[4][4] = 1; grid[3][4] = 1;
    grid[5][0] = 2; grid[5][1] = 2;
    t("hard blocks a vertical three", chooseMove("hard") === 4);

    // easy always returns a legal, playable column
    emptyGrid();
    const easyCol = chooseMove("easy");
    t("easy returns a legal move", easyCol >= 0 && easyCol < COLS && lowestEmptyRow(easyCol) !== -1);

    const pass = results.filter(r => r[1]).length;
    document.documentElement.dataset.tests = `pass:${pass}/${results.length}`;
    document.documentElement.dataset.failures =
      results.filter(r => !r[1]).map(r => r[0]).join("|") || "none";
    console.log("SELFTEST", document.documentElement.dataset.tests,
                document.documentElement.dataset.failures);
    emptyGrid();
    render();
  }
})();
</script>
</body>
</html>
